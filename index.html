<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Save Contract Data – eForm (working demo)</title>
<style>
@font-face{font-family:'72';src:url(https://ui5.sap.com/resources/sap/ui/core/themes/sap_horizon/fonts/72-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:'72';src:url(https://ui5.sap.com/resources/sap/ui/core/themes/sap_horizon/fonts/72-Bold.woff2) format('woff2');font-weight:700}
:root{--navy:#1D2D3E;--brand:#0070F2;--bg:#F5F6F7;--label:#556B82;--hint:#8396A8;--val:#223548;--line:#E8ECEF;--bord:#556B82}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'72','72full',-apple-system,'Segoe UI',Arial,sans-serif;color:var(--val)}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.h1{display:flex;align-items:center;gap:14px;padding:10px 24px}
.h1 b{font-size:15px;color:var(--navy)}.h1 span{font-size:13px;color:var(--label)}
.avatar{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.crumbs{padding:14px 24px 0;font-size:13px}.crumbs a{color:var(--brand);text-decoration:none}
.title{padding:2px 24px 4px;font-size:22px;font-weight:700;color:var(--navy)}
.sub{padding:0 24px 10px;font-size:13px;color:var(--label)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 24px 12px;scrollbar-width:thin}
.chip{white-space:nowrap;border:1px solid var(--brand);color:var(--brand);border-radius:14px;padding:4px 12px;font-size:12.5px;cursor:pointer;background:#fff}
.chip:hover{background:#EAF3FE}
.strip{margin:14px 24px 0;border:1px solid #89B8F5;background:#EAF3FE;color:#1D2D3E;border-radius:8px;padding:8px 14px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:10px 24px 90px}
section.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin:18px 0}
section.card h2{margin:0 0 14px;font-size:16px;color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px}
.f{display:flex;flex-direction:column}.f.wide{grid-column:1/-1}
label.l{font-size:13px;color:var(--label);margin-bottom:6px}
label.l .req{color:#D20A0A}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;font-size:14px;color:var(--val);border:1px solid var(--bord);border-radius:8px;padding:6px 10px;background:#fff;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
input[readonly]{background:#F5F6F7;color:#8396A8}
.hint{font-size:12px;font-style:italic;color:var(--hint);margin-top:4px}
.radios{display:flex;gap:22px;align-items:center;min-height:32px}
.radios label{display:flex;gap:7px;align-items:center;font-size:14px;cursor:pointer}
.chipbtn{align-self:flex-start;border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:14px;padding:4px 13px;font-size:13px;cursor:pointer;margin-top:8px}
.chipbtn:hover{background:#EAF3FE}
fieldset.acm{border:1px dashed #B8C4D0;border-radius:10px;margin:6px 0 0;padding:12px 14px;grid-column:1/-1}
fieldset.acm legend{font-size:12px;font-style:italic;color:var(--hint);padding:0 6px}
.note{grid-column:1/-1;font-size:12px;font-style:italic;color:var(--hint)}
table.kpi{border-collapse:collapse;width:100%;grid-column:1/-1}
table.kpi th,table.kpi td{border:1px solid #B8C4D0;font-size:13px;padding:6px 10px;text-align:left}
table.kpi th{color:var(--navy);background:#FAFBFC}
table.kpi input{border:none;padding:2px 4px;width:90px}
.prod{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.prod .tag{display:inline-block;background:#FFEB3B;font-size:12px;font-weight:700;padding:1px 8px;margin-bottom:8px}
.prod .row{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}
.prod label{font-size:13px;display:flex;gap:6px;align-items:center}
.prod .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 24px;margin-top:8px}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:10px 24px;z-index:30}
footer button{font:inherit;font-size:13px;border-radius:16px;padding:6px 16px;cursor:pointer;border:1px solid var(--brand);background:#fff;color:var(--brand)}
footer .primary{background:var(--brand);color:#fff}
footer .ghost{border:none;color:var(--brand)}footer .danger{border:none;color:#D20A0A}
footer .demo{margin-right:auto;border-style:dashed;color:var(--label);border-color:#B8C4D0}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:480px;width:92%}
dialog h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;color:var(--navy)}
dialog .list{max-height:280px;overflow:auto}
dialog .item{padding:10px 18px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between}
dialog .item:hover{background:#EAF3FE}
dialog .foot{padding:10px 18px;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:50;max-width:90%}
.hide{display:none!important}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header>
 <div class="h1"><b>Lufthansa Group</b><span>Sales Process Management</span><div class="avatar">JD</div></div>
 <div class="crumbs"><a href="#">Contracts</a> / Save Contract Data</div>
 <div class="title">Save Contract Data</div>

 <div class="chips" id="chips"></div>
</header>
<div class="strip">Prototype with sample structure. No live connection to SAP. Working demo: data stays in your browser.</div>
<main id="app"></main>
<footer>
 <button class="demo" onclick="fillSample()">Fill sample data</button>
 <button class="ghost">Close</button><button class="danger" onclick="clearAll()">Delete Record</button>
 <button onclick="window.print()">Print</button><button class="primary" onclick="submitForm()">Submit</button>
</footer>

  return '<div class="radios" id="'+id+'">'+opts.map(o=>'<label><input type="radio" name="'+id+'" value="'+o+'"> '+o+'</label>').join('')+'</div>'}

  const s=el('<section class="card" id="'+sec.id+'" '+(sec.showIf?'data-show="'+sec.showIf+'"':'')+'><h2>'+sec.title+'</h2>'+(sec.note?'<div class="hint" style="margin:-8px 0 10px">'+sec.note+'</div>':'')+'<div class="grid"></div></section>');
  const g=s.querySelector('.grid');
  if(sec.custom==='addresses'){sec.fields.forEach(f=>g.insertAdjacentHTML('beforeend',fieldHTML(sec,f)));g.insertAdjacentHTML('beforeend',CUSTOM.addresses(sec))}
  else if(sec.custom==='reliability'){g.insertAdjacentHTML('beforeend',CUSTOM.reliability(sec))}
  else if(sec.custom==='kpitable'){sec.fields.forEach(f=>g.insertAdjacentHTML('beforeend',fieldHTML(sec,f)));g.insertAdjacentHTML('beforeend',CUSTOM.kpitable(sec))}
  else{
   let acmOpen=false;
   sec.fields.forEach(f=>{
    if(f.group==='acm'&&!acmOpen){g.insertAdjacentHTML('beforeend','<fieldset class="acm"><legend>'+ (sec.acmnote||'') +'</legend><div class="grid" id="acmgrid"></div></fieldset>');acmOpen=true}
    const target=f.group==='acm'?g.querySelector('#acmgrid'):g;
    target.insertAdjacentHTML('beforeend',fieldHTML(sec,f));
    if(sec.custom==='products-after-toc'&&f.key==='toc')g.insertAdjacentHTML('beforeend',productsHTML());
   });
   if(sec.custom==='hbi-attach')g.insertAdjacentHTML('beforeend',CUSTOM['hbi-attach'](sec));
  }
  app.appendChild(s);
 });
 wire();
}
function val(idOrName){const e=document.getElementById(idOrName);if(e){if(e.type==='checkbox')return e.checked;if(e.classList&&e.classList.contains('radios')){const r=e.querySelector('input:checked');return r?r.value:''}return e.value}
 const r=document.querySelector('input[name="'+idOrName+'"]:checked');return r?r.value:''}
function evalShow(expr){const m=expr.match(/^(\w+)==(.+)$/);if(!m)return true;return String(val(m[1]))===m[2]}
function refreshVis(){document.querySelectorAll('[data-show]').forEach(n=>{n.classList.toggle('hide',!evalShow(n.dataset.show))})}
function wire(){
 document.body.addEventListener('input',onChange);document.body.addEventListener('change',onChange);
 refreshVis();computeNext();try{restore()}catch(e){}
}
function onChange(e){refreshVis();computeNext();if(e.target.id==='pbase'||e.target.id==='cend'){}try{persist()}catch(err){}}
function computeNext(){
 const pb=document.getElementById('pbase');if(!pb)return;
 let wrap=document.getElementById('nextadj');
 if(!wrap){const host=pb.closest('.f');host.insertAdjacentHTML('afterend','<div class="f"><label class="l">Next adjustment</label><input type="text" id="nextadj" readonly value="auto"><div class="hint">Auto: Price Base + 1, never earlier than the contract start year</div><label class="radios" style="margin-top:6px;font-size:14px"><input type="checkbox" id="noesc"> No escalation in first year(s) agreed</label></div>');wrap=document.getElementById('nextadj');document.getElementById('noesc').addEventListener('change',computeNext)}
 const noesc=document.getElementById('noesc').checked;wrap.readOnly=!noesc;
 if(noesc)return;
 const b=parseInt(pb.value,10);const cs=document.querySelector('[id$="--contract-start"]');
 const sy=cs&&cs.value?new Date(cs.value).getFullYear():null;
 wrap.value=isNaN(b)?'auto':Math.max(b+1,sy||0)||b+1;
}
const vh=document.getElementById('vh');
function openVH(){const l=document.getElementById('vhlist');l.innerHTML=CUSTOMERS.map((c,i)=>'<div class="item" onclick="pick('+i+')"><span><b>'+c.c+'</b> '+c.n+'</span><span style="color:var(--hint)">'+c.d+'</span></div>').join('');vh.showModal()}
function pick(i){const c=CUSTOMERS[i];set3lc(c);vh.close()}
function set3lc(c){const g=id=>document.querySelector('[id$="'+id+'"]');
 const f3=document.querySelector('[id$="--customer-3lc"]');if(f3)f3.value=c.c;
 const nm=document.querySelector('[id$="--customer-name-holder-of-contract"]');if(nm){nm.value=c.n;nm.readOnly=true}
 const db=document.querySelector('[id$="--debitor"]');if(db){db.value=c.d;db.readOnly=true}}
document.body.addEventListener('change',e=>{
 if(e.target.id&&e.target.id.endsWith('--customer-3lc')){const c=CUSTOMERS.find(x=>x.c===e.target.value.toUpperCase());if(c)set3lc(c)}
 if(e.target.id&&e.target.id.endsWith('--customer-not-yet-in-system')){const on=e.target.checked;['--customer-name-holder-of-contract','--debitor'].forEach(sfx=>{const n=document.querySelector('[id$="'+sfx+'"]');if(n){n.readOnly=!on&&sfx!=='--customer-name-holder-of-contract'?n.readOnly:!on; if(on){n.readOnly=false; if(sfx==='--debitor'){n.value='';n.placeholder='created later'}}}})}
});
let relN=1;function addRel(){relN++;document.getElementById('relx').insertAdjacentHTML('beforeend',CUSTOM.reliability.toString?'':'' );const blk='<div class="grid" style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px"><div class="f"><label class="l"><span class="req">* </span>Period Commenting</label><div class="radios">'+['Yes','No'].map(o=>'<label><input type="radio" name="rel'+relN+'-pc" value="'+o+'"> '+o+'</label>').join('')+'</div></div><div class="f"><label class="l"><span class="req">* </span>Customer Email Adress</label><textarea id="rel'+relN+'-mail"></textarea></div></div>';document.getElementById('relx').insertAdjacentHTML('beforeend',blk)}
let chN=1;function addCH(){chN++;document.getElementById('chwrap').insertAdjacentHTML('beforeend','<input type="text" style="margin-top:8px" id="ch-'+chN+'" placeholder="Additional contractholder '+chN+'">')}
function refreshAddr(){const n=parseInt(val('addrcount')||'1',10);for(let b=1;b<=5;b++){const blk=document.querySelector('.addr'+b);if(blk)blk.classList.toggle('hide',b>n)}}
document.body.addEventListener('change',e=>{if(e.target.id==='addrcount')refreshAddr()});
function toast(t){const d=el('<div class="toast">'+t+'</div>');document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function submitForm(){let miss=0;document.querySelectorAll('section.card:not(.hide) .f:not(.hide)').forEach(f=>{const req=f.querySelector('.req');if(!req)return;const inp=f.querySelector('input[type=text],input[type=date],input[type=number],textarea,select');if(inp&&!inp.value)miss++;const rd=f.querySelector('.radios');if(rd&&!f.querySelector('input:checked')&&!inp)miss++});
 if(miss)toast('Demo validation: '+miss+' required fields are still empty. (No live connection to SAP.)');else toast('All required fields filled. In the real build this would now create the phase-in record.')}
function persist(){const data={};document.querySelectorAll('input,select,textarea').forEach(n=>{if(!n.id)return;data[n.id]=n.type==='checkbox'?n.checked:n.type==='radio'?undefined:n.value});document.querySelectorAll('input[type=radio]:checked').forEach(n=>data['r:'+n.name]=n.value);localStorage.setItem('eform-draft',JSON.stringify(data))}
function restore(){const raw=localStorage.getItem('eform-draft');if(!raw)return;const data=JSON.parse(raw);Object.entries(data).forEach(([k,v])=>{if(k.startsWith('r:')){const r=document.querySelector('input[name="'+k.slice(2)+'"][value="'+v+'"]');if(r)r.checked=true;return}const n=document.getElementById(k);if(!n)return;if(n.type==='checkbox')n.checked=v;else n.value=v});refreshVis();refreshAddr();computeNext()}
function clearAll(){try{localStorage.removeItem('eform-draft')}catch(e){};location.reload()}
function fillSample(){
 set3lc(CUSTOMERS[0]);
 const q=(sfx,v)=>{const n=document.querySelector('[id$="'+sfx+'"]');if(n){n.value=v;n.dispatchEvent(new Event('change',{bubbles:true}))}};
 const rq=(name,v)=>{const r=document.querySelector('input[name$="'+name+'"][value="'+v+'"]');if(r){r.checked=true;r.dispatchEvent(new Event('change',{bubbles:true}))}};
 rq('--split-between-operator-and-contract-holder','No');
 q('--start-of-service','2027-04-01');q('--contract-start','2027-04-01');q('cend','2032-03-31');
 q('--contract-designation-n','Total Component Support B777X (N)');q('--contract-designation-g','Total Component Support B777X (G)');
 q('toc','TCS');rq('produkt','TCS');
 q('pbase','2026');
 q('--frankatur','FCA');q('--intransport-concept-incoterms','FCA');q('addrcount','2');
 q('--contract-currency-for-financial-return','\u20ac');
 toast('Sample data filled (Fussili Fly demo).');
}
render();refreshAddr();
